packages:
  - apps/*
  - packages/*
  - tools/import

# React Native libraries are not all compatible with isolated installs (Expo monorepo guide).
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  unrs-resolver: true
  "@parcel/watcher": false

minimumReleaseAgeExclude:
  - jose@6.2.18
