body{margin:0;background:#0b0b0f}
.pl *,.pl *::before,.pl *::after{box-sizing:border-box}
/* App tokens: the Tournament app's set, light first. Shared by the Console and the customer portal. */
.pl{--r-xs:4px;--r-s:6px;--r-m:10px;--r-l:14px;--r-xl:18px;--r-2xl:24px;--r-pill:999px;--frame:#0b0b0f;--bg:#f5f5f7;--panel:#ececf0;--panel2:#e3e3e9;--raise:#ffffff;--ink:#0b0b0f;--t2:#55555e;--t3:#6b6b75;--rule:#d4d4db;--rule-s:#a9a9b3;--btn:#1f1b3a;--btn-h:#2d2852;--btn-fg:#f5f5f7;--violet:#8b5cf6;
--ok:#1d6b45;--ok-bg:#e1f0e7;--warn:#8a4b00;--warn-bg:#fbefd9;--err:#9b1c2e;--err-bg:#f8e6e9;--info-bg:#e8e6f6;--live:#f0a020;--bar:#1f1b3a;--bar-2:#b9b6cc;--scrim:rgba(11,11,15,.42);--shadow:0 30px 80px rgba(11,11,15,.24),0 2px 8px rgba(11,11,15,.08);
--sb:#0b0b0f;--sb-2:#18181d;--sb-ink:#f1f1f4;--sb-t2:#a3a3ad;--sb-rule:#24242a;--ease:cubic-bezier(.22,1,.36,1);--disp:"Unbounded","Archivo",ui-sans-serif,sans-serif;--body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--frame);padding:14px;min-height:100vh;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color-scheme:light}
.pl.dark{--bg:#111115;--panel:#1a1a1f;--panel2:#232329;--raise:#1c1c22;--ink:#f1f1f4;--t2:#a3a3ad;--t3:#8e8e98;--rule:#2a2a31;--rule-s:#474750;--btn:#f1f1f4;--btn-h:#ffffff;--btn-fg:#0b0b0f;
--ok:#8fd8ae;--ok-bg:#15301f;--warn:#ffc45e;--warn-bg:#33260d;--err:#f3a3b0;--err-bg:#3a1820;--info-bg:#221f33;--live:#ffb224;--bar:#d9d6f2;--bar-2:#4a4760;--scrim:rgba(0,0,0,.66);--shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px #2a2a31;
--sb:#0b0b0f;--sb-2:#17171c;--sb-rule:#24242a;color-scheme:dark}
.site{container:site/inline-size;background:var(--bg);min-height:calc(100vh - 28px);position:relative;color:var(--ink)}
:where(.pl) a{color:inherit}
:where(.pl) p,:where(.pl) h1,:where(.pl) h2,:where(.pl) h3,:where(.pl) h4,:where(.pl) ul,:where(.pl) ol,:where(.pl) dl,:where(.pl) dd,:where(.pl) figure{margin:0}
:where(.pl) h1,:where(.pl) h2,:where(.pl) h3,:where(.pl) h4{font-weight:inherit}
:where(.pl) ul,:where(.pl) ol{list-style:none;padding:0}
.pl :focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.pl ::selection{background:var(--btn);color:var(--btn-fg)}
:where(.pl) h1,:where(.pl) h2,:where(.pl) h3{text-wrap:balance}
:where(.pl) p{text-wrap:pretty}
:where(.pl) a,:where(.pl) button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (prefers-contrast:more){.pl{--t2:#3a3a42;--t3:#3a3a42;--rule:#8e8e98;--rule-s:#55555e}.pl.dark{--t2:#d0d0d8;--t3:#d0d0d8;--rule:#6b6b75;--rule-s:#a3a3ad}}
@media (forced-colors:active){.pl .btn,.pl .ib,.tg-b,.card{border:1px solid CanvasText}.tg-now{background:Highlight}}
.pl button,.pl input,.pl select,.pl textarea{font-family:inherit;color:inherit}
.d{font-family:var(--disp);font-weight:300;letter-spacing:-.045em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic-s{width:15px;height:15px}
.ul{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size 120ms var(--ease)}
.ul:hover{background-size:100% 1px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-pill);font:600 14px/1 var(--body);letter-spacing:.005em;text-decoration:none;white-space:nowrap;border:0;cursor:pointer;transition:background-color 120ms,box-shadow 120ms,transform 80ms}
.btn:active{transform:scale(.98)}
.pl .btn-ink{background:var(--btn);color:var(--btn-fg)}
.pl .btn-ink:hover{background:var(--btn-h)}
.pl .btn-line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule-s)}
.pl .btn-line:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.pl .btn-ghost{background:none;color:var(--ink)}
.pl .btn-ghost:hover{background:var(--panel2)}
.btn-s{height:36px;padding:0 14px;font-size:13px;gap:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ib{width:40px;height:40px;flex:none;border-radius:var(--r-pill);display:inline-grid;place-items:center;background:none;border:0;cursor:pointer;color:inherit;transition:background-color 120ms}
.ib:hover{background:var(--panel2)}
.alink{display:inline-flex;align-items:center;gap:8px;min-height:36px;font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.alink .ic{transition:transform 120ms var(--ease)}
.alink:hover .ic{transform:translateX(3px)}

/* chips and status (status always carries an icon or dot plus a word) */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--panel2);font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:var(--err-bg);color:var(--err)}
.chip.info{background:var(--info-bg);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--t2)}
.dot.ok{background:#2f9e63}.dot.warn{background:var(--live)}.dot.err{background:#d0384f}
.dark .dot.ok{background:#8fd8ae}.dark .dot.err{background:#f3a3b0}
.av{width:28px;height:28px;flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--panel2);font:400 10px/1 var(--disp);letter-spacing:-.02em;color:var(--ink)}
.av-ink{background:var(--btn);color:var(--btn-fg)}

/* forms */
.f{display:grid;gap:6px}
.f-l{font-size:13px;font-weight:600}
.inp{width:100%;height:44px;border-radius:var(--r-l);border:0;background:var(--raise);box-shadow:inset 0 0 0 1px var(--rule);padding:0 14px;font-size:14px}
.dark .inp{background:var(--panel2)}
.inp:focus{outline:2px solid var(--violet);outline-offset:1px}
.srch{position:relative;display:flex;align-items:center}
.srch .ic{position:absolute;left:12px;color:var(--t2);pointer-events:none}
.srch .inp{padding-left:38px;height:40px;border-radius:var(--r-pill);background:var(--panel)}
.srch kbd{position:absolute;right:10px;font:600 11px/1 var(--body);color:var(--t2);background:var(--raise);border-radius:var(--r-s);padding:4px 6px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--panel)}
.seg button{height:30px;padding:0 12px;border:0;border-radius:var(--r-pill);background:none;font:600 12px/1 var(--body);color:var(--t2);cursor:pointer}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(11,11,15,.08)}
.dark .seg button.on{background:var(--panel2)}

/* boxes, tables */
.box-t{font-size:15px;font-weight:700}
.spark{width:96px;height:28px;display:block}
.spark polyline{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark.err polyline{stroke:var(--err)}
.empty{padding:56px 24px;border-radius:var(--r-xl);border:1px dashed var(--rule-s);display:grid;justify-items:center;gap:10px;text-align:center}
.empty .ic{width:28px;height:28px;color:var(--t2)}
.empty p{max-width:46ch;color:var(--t2)}
.empty h3{font:300 22px/1.2 var(--disp);letter-spacing:-.04em}
.sk{background:var(--panel2);border-radius:var(--r-m);display:block}
.alert{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--r-l);font-size:14px}
.alert .ic{margin-top:1px}
.alert.err{background:var(--err-bg);color:var(--ink)}
.alert.err .ic{color:var(--err)}
.alert.warn{background:var(--warn-bg)}
.alert.warn .ic{color:var(--warn)}
.alert.info{background:var(--info-bg)}
.alert .grow{flex:1}
.alert b{font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;height:44px;padding:0 12px;border:0;background:none;font:600 13px/1 var(--body);color:var(--t2);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tab .c{color:var(--t2);font-weight:500}
.prog{height:2px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;width:62%;background:var(--ink)}

/* data tables: CSS grid rows (the prototype runtime can't loop inside <tbody>; production can use <table>) */
.dt{display:grid;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.dt .who{display:flex;align-items:center;gap:10px;min-width:0}
.dt .who>span:last-child{min-width:0}
.dt .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .who span span{display:block;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Console shell: an ink sidebar in both themes, so staff always know they are in the back office ── */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);align-items:start;min-height:calc(100vh - 28px)}
.sb{position:relative;align-self:stretch;min-height:calc(100vh - 28px);background:var(--sb);color:var(--sb-ink);display:flex;flex-direction:column;padding:18px 14px 16px;gap:18px;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.sb nav{display:grid;gap:2px}
.sb-g{font-size:11px;font-weight:700;color:#8e8e98;letter-spacing:.02em;padding:0 10px 6px}
.sb a.nl{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r-m);font-size:14px;font-weight:600;color:var(--sb-t2);text-decoration:none;transition:background-color 120ms,color 120ms}
.sb a.nl:hover{background:var(--sb-2);color:var(--sb-ink)}
.sb a.nl.on{background:#24242b;color:var(--sb-ink)}
.sb a.nl .ic{width:17px;height:17px}
.sb a.nl .n{margin-left:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:#2c2c34;color:var(--sb-ink);display:inline-grid;place-items:center}
.sb a.nl .n.err{background:#5a1f2b;color:#ffd6dd}
.sb a.nl .dot{margin-left:auto}
.sb-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--sb-rule)}
.sb-me .av{background:#f1f1f4;color:#0b0b0f}
.sb-me div{flex:1;min-width:0;font-size:13px;line-height:1.3}
.sb-me b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-me span{font-size:12px;color:var(--sb-t2)}
.sb-me .ib{color:var(--sb-t2)}
.sb-me .ib:hover{background:var(--sb-2);color:var(--sb-ink)}
.mn{min-width:0}
.tb{display:flex;align-items:center;gap:12px;height:64px;padding:0 24px 0 32px;border-bottom:1px solid var(--rule)}
.tb .srch{flex:0 1 420px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pg{padding:32px 32px 72px;max-width:1360px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:24px}
.ph h1{font:300 clamp(30px,3cqw,40px)/1.05 var(--disp);letter-spacing:-.045em}
.ph p{margin-top:8px;font-size:14px;color:var(--t2);max-width:64ch}
.ph-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:12px}
.crumb a{color:var(--ink);text-decoration:none}
.stack{display:grid;gap:16px}

/* status */

/* incident */

.tl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:14px;padding-bottom:22px;position:relative}

.tl li:last-child::before{display:none}
.tl .tl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

/* tournament */
.lc{border-radius:var(--r-xl);background:var(--panel);padding:18px;display:grid;gap:12px}

/* wishlist */

/* customer */
.note{padding:14px 16px;border-radius:var(--r-l);background:var(--raise);font-size:14px;line-height:1.55}

/* staff */

/* ── bwd Portal on the Planary app system ── */
.bw-mark{width:30px;height:30px;border-radius:var(--r-m);display:inline-grid;place-items:center;background:#f1f1f4;color:#0b0b0f;font:600 10px/1 var(--disp);letter-spacing:-.06em;flex:none}
.bw-wm{display:inline-flex;align-items:center;gap:10px;font:400 16px/1 var(--disp);letter-spacing:-.045em;text-decoration:none;color:inherit}
.bw-wm small{font:600 12px/1 var(--body);letter-spacing:0;opacity:.6}
.bell{position:relative}
.bell .bdg{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);background:var(--live);color:#1a1100;font:700 10px/16px var(--body);text-align:center}
.tb-t{font-size:13px;color:var(--t2);font-weight:600;white-space:nowrap}
.pg{max-width:1280px}
.k{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:.02em}
.h2{font:300 22px/1.15 var(--disp);letter-spacing:-.04em}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.row-h .alink{font-size:13px}
.g12{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
.stack{display:grid;gap:16px}
.card{border-radius:var(--r-xl);background:var(--panel);padding:20px}

.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-s);font-size:11px;font-weight:700;background:var(--panel2);color:var(--t2);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)}

.tag.info{background:var(--info-bg);color:var(--ink)}
/* greeting + next lesson */
.hi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:24px}
.hi h1{font:300 clamp(30px,3cqw,42px)/1.05 var(--disp);letter-spacing:-.045em}
.hi p{margin-top:8px;color:var(--t2);font-size:15px}
.next{border-radius:var(--r-2xl);background:var(--btn);color:var(--btn-fg);padding:24px;display:grid;gap:14px}
.dark .next{background:#1c1c22;color:var(--ink);box-shadow:inset 0 0 0 1px #2a2a31}
.next .k{color:inherit;opacity:.7}
.next-t{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next-t b{font:300 32px/1.05 var(--disp);letter-spacing:-.045em}
.next-t span{font:400 22px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.next-m{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px;opacity:.85}
.next-m span{display:inline-flex;align-items:center;gap:6px}
.next-chg{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-l);background:rgba(240,160,32,.18);font-size:13px;font-weight:600}
.dark .next-chg{background:var(--warn-bg);color:var(--warn)}
/* lesson rows */
.les{display:grid}
/* quick access */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qa a{display:grid;gap:10px;padding:16px;border-radius:var(--r-xl);background:var(--panel);text-decoration:none;font-size:13px;font-weight:700}
.qa a .ic{width:22px;height:22px}
.qa a:hover{background:var(--panel2)}
/* grades */
.gr-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);text-decoration:none}
.gr-row:first-child{border-top:0;padding-top:0}
.gr-row b{display:block;font-weight:700}
.gr-row span.s{font-size:12px;color:var(--t2)}
.gv{font:400 22px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.gv.low{color:var(--err)}
.gb{width:120px;height:6px;border-radius:var(--r-pill);background:var(--panel2);position:relative;overflow:hidden}
.gb i{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-pill);background:var(--bar)}
.gb.low i{background:var(--err)}
.avg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}

.avg b{font:300 38px/1 var(--disp);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.avg span{font-size:12px;color:var(--t2)}
.subj{display:grid}
.sj{display:grid;grid-template-columns:44px minmax(0,1fr) 120px 56px 18px;gap:16px;align-items:center;padding:14px 4px;border-top:1px solid var(--rule);text-decoration:none}

.sj-i{width:44px;height:44px;border-radius:var(--r-l);display:grid;place-items:center;background:var(--raise);font:400 12px/1 var(--disp);letter-spacing:-.03em;box-shadow:inset 0 0 0 1px var(--rule)}

.sj-m b{display:block;font-weight:700;font-size:15px}
.sj-m span{font-size:12px;color:var(--t2)}

.exams{display:grid}
.ex{display:grid;grid-template-columns:minmax(0,1fr) 70px 60px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}
.ex:first-child{border-top:0;padding-top:0}
.ex b{display:block;font-weight:700}
.ex span.s{font-size:12px;color:var(--t2)}
.ex .w{font-size:12px;color:var(--t2);text-align:right}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:8px}
.spark i{flex:1;border-radius:6px 6px 3px 3px;background:var(--bar-2)}
.spark i.last{background:var(--bar)}
.spark-l{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-top:6px}
/* absences */
.ab-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.ab-sum div{border-radius:var(--r-xl);background:var(--panel);padding:18px 20px;display:grid;gap:4px}
.ab-sum b{font:300 34px/1 var(--disp);letter-spacing:-.05em}
.ab-sum span{font-size:12px;color:var(--t2)}
.ab-sum .warn{background:var(--warn-bg)}
.abl{display:grid}
.ab{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--rule)}
.ab:first-child{border-top:0;padding-top:0}
.ab-d{display:grid;justify-items:center;padding:6px 0;border-radius:var(--r-l);background:var(--raise);box-shadow:inset 0 0 0 1px var(--rule);line-height:1.1}

.ab-d b{font:400 18px/1 var(--disp)}
.ab-d span{font-size:10px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.04em}
.ab-m b{display:block;font-weight:700}
.ab-m span{font-size:12px;color:var(--t2)}

.dl b{display:block;font-weight:700}

.lk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lc{display:grid;grid-template-columns:48px minmax(0,1fr) 18px;gap:14px;align-items:center;padding:16px;border-radius:var(--r-xl);background:var(--panel);text-decoration:none}

.att2 span.s{font-size:12px;color:var(--t2)}
.nt-d{font-size:12px;font-weight:700;color:var(--t2);margin:20px 0 8px}

.nt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 16px;border-radius:var(--r-xl);text-decoration:none}
.nt.unread{background:var(--panel)}
.nt-i{width:40px;height:40px;border-radius:var(--r-l);display:grid;place-items:center;background:var(--panel2)}

.pf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:24px;border-radius:var(--r-2xl);background:var(--panel);margin-bottom:16px}

.st span.s{font-size:12px;color:var(--t2)}
